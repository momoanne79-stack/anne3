function saveState(id,patch){const d=getData();d[id]=Object.assign(state(id),patch);setData(d)}
function itemId(ui,qi){return UNITS[ui].id+'_'+String(qi).padStart(2,'0')}
function qIndexFromId(id){return Math.max(0,Number(String(id).split('_').pop())-1)}
function allCount(){return UNITS.reduce((a,u)=>a+u.questions.length,0)}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function tokens(s){return s.replace(/[“”]/g,'"').replace(/[‘’]/g,"'").split(/\s+/).filter(Boolean)}
function norm(s){return s.toLowerCase().replace(/[“”‘’'".,!?;:()\[\]]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function initAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(f,d=0.12,type='sine',vol=.08){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}
function sfxOK(){initAudio();tone(620,.09);setTimeout(()=>tone(880,.14),90)}
function sfxNG(){initAudio();tone(220,.16,'sawtooth',.06)}
function showOk(){const old=$('.ok-pop');if(old)old.remove();const el=document.createElement('div');el.className='ok-pop';el.textContent='OK';document.body.appendChild(el);setTimeout(()=>el.remove(),900);['🎉','⭐','✨','👏','💯','🌟'].forEach((t,i)=>{const s=document.createElement('span');s.className='spark';s.textContent=t;s.style.setProperty('--x',((i-2.5)*42)+'px');s.style.setProperty('--y',(-70-Math.random()*40)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)})}
function scoreOf(st,total){const done=(st.done||[]).length, wrong=(st.wrong||[]).length;return total?Math.round(Math.max(0,done-wrong)/total*100):0}
function refreshPass(id){const ui=UNITS.findIndex(u=>u.id===id), u=UNITS[ui], st=state(id);const pass=(st.done||[]).length===u.questions.length && (st.wrong||[]).length===0;const sc=scoreOf(st,u.questions.length);saveState(id,{passed:pass,best:Math.max(st.best||0,sc),lastScore:sc,lastTime:nowStr()});return pass}
function allWrong(){const out=[];UNITS.forEach((u,ui)=>{const st=state(u.id);(st.wrong||[]).forEach(id=>{const qi=qIndexFromId(id);if(u.questions[qi])out.push({ui,id,q:u.questions[qi]})})});return out}
function buildItems(ui,m,itemIds){const u=UNITS[ui], st=state(u.id);let ids=[];if(Array.isArray(itemIds)&&itemIds.length)ids=itemIds;else if(m==='wrong')ids=(st.wrong||[]).slice();else ids=u.questions.map((_,i)=>itemId(ui,i+1));return ids.map(id=>{const qi=qIndexFromId(id);return {id,q:u.questions[qi]}}).filter(x=>x.q)}
function nextUnsolved(ui){const u=UNITS[ui], st=state(u.id);for(let i=0;i<u.questions.length;i++){if(!(st.done||[]).includes(itemId(ui,i+1)))return i}return u.questions.length}
function saveProgress(next=qIndex){if(!quizItems.length)return;const u=UNITS[currentUnit];saveState(u.id,{progress:{active:true,mode,qIndex:next,correct:roundCorrect,itemIds:quizItems.map(x=>x.id),questionHadWrong,updatedAt:nowStr()}})}
function clearProgress(ui=currentUnit){const u=UNITS[ui];saveState(u.id,{progress:null})}
function renderShell(){renderTabs();const sections=$('#sections');sections.innerHTML='';UNITS.forEach((u,i)=>{const sec=document.createElement('section');sec.id='section-'+u.id;sec.className='section '+(currentTab==='unit'&&currentUnit===i?'active':'');sections.appendChild(sec);renderHome(i)});const rec=document.createElement('section');rec.id='section-record';rec.className='section '+(currentTab==='record'?'active':'');sections.appendChild(rec);renderRecord();const wrong=document.createElement('section');wrong.id='section-wrong';wrong.className='section '+(currentTab==='wrong'?'active':'');sections.appendChild(wrong);renderWrong()}
function renderTabs(){const tabs=$('#tabs');tabs.innerHTML='';UNITS.forEach((u,i)=>{const st=state(u.id);const b=document.createElement('button');b.className='tab '+(currentTab==='unit'&&currentUnit===i?'active ':'')+(st.passed?'pass ':'');b.textContent=u.tab;b.onclick=()=>showUnit(i);tabs.appendChild(b)});const r=document.createElement('button');r.className='tab '+(currentTab==='record'?'active':'');r.textContent='기록';r.onclick=()=>{currentTab='record';renderShell()};tabs.appendChild(r);const w=document.createElement('button');w.className='tab warn '+(currentTab==='wrong'?'active':'');w.textContent='오답 '+allWrong().length;w.onclick=()=>{currentTab='wrong';renderShell()};tabs.appendChild(w)}
function showUnit(i){currentTab='unit';currentUnit=i;mode='full';renderShell()}
function renderHome(i){const u=UNITS[i], st=state(u.id), total=u.questions.length, wrong=(st.wrong||[]).length, done=(st.done||[]).length, sc=scoreOf(st,total);const p=st.progress;const prog=p&&p.active?`<div class="card soft"><div class="record"><div><b>저장된 풀이</b><br><small>${p.mode==='wrong'?'오답':'전체'} 진행 · ${Math.min(p.qIndex||0,(p.itemIds||[]).length)}/${(p.itemIds||[]).length} · 마지막 저장 ${p.updatedAt||'-'}</small></div><strong>${p.correct||0}</strong></div><button class="btn orange" onclick="continueProgress(${i})">이어 풀기</button></div>`:'';$('#section-'+u.id).innerHTML=`<div class="card soft"><h2 class="title">${u.title}</h2><div class="desc">총 ${total}문제 · 뜻을 보고 영어 단어를 순서대로 배열합니다.</div><div class="status" style="margin-top:10px"><span class="badge ${st.passed?'green':'gold'}">${st.passed?'PASS 통과':'통과 전'}</span><span class="badge">진행 ${done}/${total}</span><span class="badge red">오답 ${wrong}개</span></div><div class="progress"><div class="bar" style="width:${sc}%"></div></div></div>${prog}<div class="card"><div class="btn-row"><button class="btn" onclick="startRound(${i},'full')">처음부터 / 이어서 풀기</button><button class="btn orange" onclick="startRound(${i},'wrong')" ${wrong?'':'disabled'}>오답 풀기 (${wrong})</button></div><button class="btn secondary" onclick="resetUnit(${i})">이 Unit 기록 초기화</button></div><div id="quiz-${u.id}" class="hidden"></div>`}
function startRound(i,m){currentTab='unit';currentUnit=i;mode=m;const u=UNITS[i];quizItems=buildItems(i,m);if(m==='wrong'&&!quizItems.length){alert('남은 오답이 없습니다.');return}const st=state(u.id);qIndex=(m==='full')?Math.min(nextUnsolved(i),quizItems.length):0;if(qIndex>=quizItems.length&&m==='full')qIndex=0;roundCorrect=0;locked=false;questionHadWrong=false;saveProgress(qIndex);renderShell();$('#quiz-'+u.id).classList.remove('hidden');loadQuestion()}
function continueProgress(i){const u=UNITS[i], p=state(u.id).progress;if(!p||!p.active)return startRound(i,'full');currentTab='unit';currentUnit=i;mode=p.mode||'full';quizItems=buildItems(i,mode,p.itemIds);qIndex=Math.min(p.qIndex||0,quizItems.length);roundCorrect=p.correct||0;questionHadWrong=!!p.questionHadWrong;locked=false;renderShell();$('#quiz-'+u.id).classList.remove('hidden');if(qIndex>=quizItems.length)finishRound();else loadQuestion()}
function loadQuestion(){locked=false;questionHadWrong=false;const u=UNITS[currentUnit], item=quizItems[qIndex];if(!item)return finishRound();saveProgress(qIndex);const box=$('#quiz-'+u.id), total=quizItems.length;box.innerHTML=`<div class="card quiz-head"><div class="status"><span class="badge">${mode==='wrong'?'오답':'전체'} ${qIndex+1} / ${total}</span><span class="badge">${u.tab} · ${item.q.no}번</span><span class="badge green">정답 ${roundCorrect}</span></div><div class="qno">뜻</div><div class="ko">${item.q.ko}</div><div class="hint">단어를 위 답안 영역으로 옮기세요. 모든 단어가 올라가면 자동 채점됩니다.</div></div><div id="answer" class="answer"></div><div id="bank" class="bank"></div><div id="feedback" class="feedback"></div>`;const bank=$('#bank');shuffle(tokens(item.q.en)).forEach(w=>{const chip=document.createElement('button');chip.type='button';chip.className='chip';chip.textContent=w;chip.onclick=()=>moveChip(chip);bank.appendChild(chip)});setupSortable();setTimeout(()=>box.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function setupSortable(){if(window._sortA){try{window._sortA.destroy();window._sortB.destroy()}catch(e){}}const answer=$('#answer'), bank=$('#bank');if(!answer||!bank||!window.Sortable)return;const opts={group:'words',animation:160,ghostClass:'sortable-ghost',dragClass:'sortable-drag',fallbackOnBody:true,swapThreshold:.65,onEnd:()=>setTimeout(autoCheck,60)};window._sortA=Sortable.create(answer,opts);window._sortB=Sortable.create(bank,opts)}
function moveChip(chip){if(locked)return;initAudio();const answer=$('#answer'), bank=$('#bank');if(chip.parentElement===bank)answer.appendChild(chip);else bank.appendChild(chip);setTimeout(autoCheck,50)}
function autoCheck(){if(locked)return;const bank=$('#bank');if(bank&&bank.children.length===0)checkAnswer()}
function checkAnswer(){if(locked)return;const item=quizItems[qIndex], ans=$all('#answer .chip').map(c=>c.textContent).join(' '), ok=norm(ans)===norm(item.q.en), fb=$('#feedback');if(ok){locked=true;$('#answer').style.background='#e8fff4';$('#answer').style.borderColor='var(--green)';$all('.chip').forEach(c=>c.disabled=true);if(!questionHadWrong)roundCorrect++;markCorrect(item.id);saveProgress(qIndex+1);showOk();sfxOK();fb.className='feedback ok show';fb.innerHTML=`<div style="text-align:center">맞았어요!<button class="btn" onclick="nextQuestion()">${qIndex+1<quizItems.length?'다음 문제':'결과 보기'}</button></div>`}else{questionHadWrong=true;markWrong(item.id);saveProgress(qIndex);$('#answer').style.background='#fff0f0';$('#answer').style.borderColor='var(--red)';sfxNG();fb.className='feedback ng show';fb.textContent='순서가 아직 맞지 않습니다. 단어를 다시 드래그해서 고쳐 보세요.';setTimeout(()=>{if(!locked){$('#answer').style.background='#eef7ff';$('#answer').style.borderColor='var(--main)'}},650)}renderTabs()}
function markWrong(id){if(mode==='wrong')return;const u=UNITS[currentUnit], st=state(u.id);if(!(st.wrong||[]).includes(id))st.wrong.push(id);saveState(u.id,{wrong:st.wrong,lastTime:nowStr()})}
function markCorrect(id){const u=UNITS[currentUnit], st=state(u.id);if(!(st.done||[]).includes(id))st.done.push(id);if(mode==='wrong')st.wrong=(st.wrong||[]).filter(x=>x!==id);const qi=qIndexFromId(id);const nextIdx=Math.min(qi+1,u.questions.length);saveState(u.id,{done:st.done,wrong:st.wrong,lastTime:nowStr(),progress:null});refreshPass(u.id)}
function nextQuestion(){qIndex++;if(qIndex<quizItems.length)loadQuestion();else finishRound()}
function finishRound(){const u=UNITS[currentUnit], st=state(u.id);st.attempts=(st.attempts||0)+1;saveState(u.id,{attempts:st.attempts,progress:null});const pass=refreshPass(u.id), newSt=state(u.id), total=u.questions.length, wrong=(newSt.wrong||[]).length, sc=scoreOf(newSt,total);const box=$('#quiz-'+u.id);box.innerHTML=`<div class="card finish"><div class="big-emoji">${pass?'🏆':'📝'}</div><h2 class="title">${u.tab} 결과</h2><div class="score-big">${sc}점</div><div class="desc">진행 ${(newSt.done||[]).length}/${total} · 남은 오답 ${wrong}개<br>${pass?'기록에서 PASS 통과로 표시됩니다.':'오답까지 마무리하면 PASS 처리됩니다.'}</div><div class="btn-row"><button class="btn" onclick="startRound(${currentUnit},'full')">계속 연습</button><button class="btn orange" onclick="startRound(${currentUnit},'wrong')" ${wrong?'':'disabled'}>오답 풀기</button></div><button class="btn secondary" onclick="showRecord()">기록 보기</button></div>`;renderTabs()}
function showRecord(){currentTab='record';renderShell()}
function renderRecord(){const sec=$('#section-record');let totalPass=0;let html=`<div class="card soft"><h2 class="title">학습 기록</h2><div class="desc">Unit24, Unit25까지 총 ${allCount()}문항이 들어 있습니다. 오답을 모두 없애면 PASS로 표시됩니다.</div></div><div class="record-grid">`;UNITS.forEach((u,i)=>{refreshPass(u.id);const st=state(u.id), total=u.questions.length, wrong=(st.wrong||[]).length, done=(st.done||[]).length, sc=scoreOf(st,total);if(st.passed)totalPass++;html+=`<div class="card"><h3 class="title" style="font-size:18px">${u.tab} <span class="badge ${st.passed?'green':'gold'}">${st.passed?'PASS':'미통과'}</span></h3><div class="record"><div><b>${u.title}</b><br><small>진행 ${done}/${total} · 오답 ${wrong}개 · 최근 ${st.lastTime||'-'}</small></div><strong>${sc}점</strong></div><div class="btn-row"><button class="btn" onclick="showUnit(${i});startRound(${i},'full')">이어 풀기</button><button class="btn orange" onclick="showUnit(${i});startRound(${i},'wrong')" ${wrong?'':'disabled'}>오답 풀기</button></div></div>`});html+=`</div><div class="card soft"><div class="record"><div><b>전체 통과</b><br><small>총 ${allCount()}문항</small></div><strong>${totalPass}/${UNITS.length}</strong></div><button class="btn danger" onclick="clearAll()">전체 기록 초기화</button></div>`;sec.innerHTML=html}
function renderWrong(){const sec=$('#section-wrong'), list=allWrong();let html=`<div class="card soft"><h2 class="title">오답 다시 풀기</h2><div class="desc">틀린 문제는 여기에 남고, 다시 맞히면 사라집니다.</div></div>`;if(!list.length){sec.innerHTML=html+'<div class="empty">남은 오답이 없습니다.</div>';return}const groups={};list.forEach(x=>{(groups[x.ui]||(groups[x.ui]=[])).push(x)});Object.keys(groups).forEach(k=>{const ui=Number(k),u=UNITS[ui];html+=`<div class="card"><div class="status"><h3 class="title" style="margin:0;font-size:18px">${u.tab}</h3><span class="badge red">${groups[k].length}개</span></div><div class="wrong-list">${groups[k].map(x=>`<div class="wrong-item"><div class="unit">${u.tab} - ${x.q.no}번</div><div>${x.q.ko}</div><div class="en">${x.q.en}</div></div>`).join('')}</div><button class="btn orange" onclick="showUnit(${ui});startRound(${ui},'wrong')">${u.tab} 오답 풀기</button></div>`});sec.innerHTML=html}
function resetUnit(i){if(!confirm(UNITS[i].tab+' 기록을 초기화할까요?'))return;const d=getData();delete d[UNITS[i].id];setData(d);renderShell()}
function clearAll(){if(!confirm('전체 기록을 초기화할까요?'))return;localStorage.removeItem(STORE);renderShell()}
renderShell();
</script>
</body>
</html>
